plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'ploceus' version '1.11-SNAPSHOT'
}

version = "${mod_version}+${minecraft_version}"
group = rootProject.findProperty("maven_group")

base {
    archivesName = "${mod_id}-fabric"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {url = "https://maven.terraformersmc.com/releases/"}  // Mod Menu repository
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    clientOnlyMinecraftJar()
    mixin {
        defaultRefmapName.set("lighty.refmap.json")
    }
    runs {
        client {
            environment = "client"
            // The full name of the run configuration, i.e. 'Minecraft Client'. By default this is determined from the base name.
            configName = "Minecraft Client"
            // The default main class of the run configuration. This will be overridden if using a mod loader with a fabric_installer.json file.
            runDir = "run"
            // The sourceset to run, commonly set to sourceSets.test
            source = sourceSets.main
            // When true a run configuration file will be generated for IDE's. By default only set to true for the root project.
            ideConfigGenerated = true
            client()
        }
    }
}
ploceus {
    clientOnlyMappings()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings project.ploceus.featherMappings(project.feather_build)
    exceptions project.ploceus.raven(project.raven_build) // remove this line if not using exceptions patches
    signatures project.ploceus.sparrow(project.sparrow_build) // remove this line if not using generics patches
    nests project.ploceus.nests(project.nests_build) // remove this line if not using inner class patches

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
    ploceus.dependOsl(project.osl_version, environment)
}

compileJava {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            issue_url: issue_url,
            modmenu_version: modmenu_version,
            fabric_loader_version: fabric_loader_version,
            minecraft_version_lower_bound: minecraft_version_lower_bound
    ]

    inputs.properties replaceProperties

    from sourceSets.main.resources

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }

}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
